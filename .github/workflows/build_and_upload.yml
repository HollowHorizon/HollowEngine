name: build
on:
  push:
    branches: [ "dev" ]

jobs:
  create_tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^modVersion=' gradle.properties | cut -d'=' -f2)
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: Delete existing tag if it exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Удаляем тег, если он уже существует
          git tag -d "$MOD_VERSION" || true
          git push origin --delete "$MOD_VERSION" || true

      - name: Create and push new tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Создаём новый тег с версией мода
          git tag "$MOD_VERSION"
          git push origin "$MOD_VERSION"

  build:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    needs: create_tag
    if: |
      !contains(github.event.head_commit.message, '[no ci]')
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^modVersion=' gradle.properties | cut -d'=' -f2)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: verify bundled libraries
        run: |
          ls -lah libs
          test -f libs/kool-core-desktop-0.20.0-SNAPSHOT.jar

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Release to GitHub
        uses: gradle/gradle-build-action@v2
        with:
          arguments: buildAndCollect

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            merged/*.jar
            !merged/*-dev.jar
            !merged/*-sources.jar

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: "[HollowEngine 1.21.1 | v${{ steps.get_version.outputs.mod_version }}]"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ steps.get_version.outputs.mod_version }}"
          removeArtifacts: true
          allowUpdates: true
          artifacts: "merged/*.jar"
          artifactContentType: application/java-archive

      - name: Notify Telegram about Release
        if: ${{ success() && runner.os == 'Linux' && matrix.java == '21' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          MOD_VERSION: ${{ env.MOD_VERSION }}
          VERSION: ${{ steps.get_version.outputs.mod_version }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          
          HEADER="<b>📦 <a href=\"$RELEASE_URL\">[$REPO_NAME] Build Success</a></b>"
          
          # Формируем тело сообщения
          DETAILS="Версия: <code>$MOD_VERSION</code>
          Ветка: <code>${GITHUB_REF#refs/heads/}</code>
          
          <i>Мод был обновлён на GitHub Releases.</i>"
          
          FINAL_TEXT="<blockquote>$HEADER"$'\n'"$DETAILS</blockquote>"
          
          jq -n \
            --arg chat_id "$TG_CHAT_ID" \
            --arg thread_id "$TG_THREAD_ID" \
            --arg text "$FINAL_TEXT" \
            '{
              chat_id: $chat_id,
              message_thread_id: $thread_id,
              parse_mode: "HTML",
              disable_web_page_preview: true,
              text: $text
            }' > payload.json
          
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d @payload.json
