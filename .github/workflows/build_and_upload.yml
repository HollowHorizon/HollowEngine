name: build
on:
  push:
    branches: [ "[disabled] dev" ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 21 ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    if: |
      !contains(github.event.head_commit.message, '[no ci]')
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Get the mod version from gradle.properties
        id: get_version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV

      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Release to GitHub
        uses: gradle/gradle-build-action@v2
        with:
          arguments: buildAndCollect

      - name: capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '21' }}
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            merged/*.jar
            !merged/*-dev.jar
            !merged/*-sources.jar

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          name: "[HollowEngine 1.20.1 | Latest Release]"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "latest-1.20.1"
          removeArtifacts: true
          allowUpdates: true
          artifacts: "merged/*.jar"
          artifactContentType: application/java-archive

      - name: Notify Telegram about Release
        if: ${{ success() && runner.os == 'Linux' && matrix.java == '21' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          MOD_VERSION: ${{ env.MOD_VERSION }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/latest-1.20.1"
          
          HEADER="<b>📦 <a href=\"$RELEASE_URL\">[$REPO_NAME] Build Success</a></b>"
          
          # Формируем тело сообщения
          DETAILS="Версия: <code>$MOD_VERSION</code>
          Ветка: <code>${GITHUB_REF#refs/heads/}</code>
          
          <i>Мод был обновлён на GitHub Releases.</i>"
          
          FINAL_TEXT="<blockquote>$HEADER"$'\n'"$DETAILS</blockquote>"
          
          jq -n \
            --arg chat_id "$TG_CHAT_ID" \
            --arg thread_id "$TG_THREAD_ID" \
            --arg text "$FINAL_TEXT" \
            '{
              chat_id: $chat_id,
              message_thread_id: $thread_id,
              parse_mode: "HTML",
              disable_web_page_preview: true,
              text: $text
            }' > payload.json
          
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -H "Content-Type: application/json" \
            -d @payload.json